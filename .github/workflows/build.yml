name: Build Walk POC (tailscale latest)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false # 关闭缓存，强制每次拉取 master 最新代码

      - name: 编译 rsrc.syso (AMD64 架构)
        run: |
          go install github.com/akavel/rsrc@latest
          $GOPATH = go env GOPATH
          & "$GOPATH\bin\rsrc.exe" -manifest app.manifest -arch amd64 -o rsrc.syso

      - name: 切换至 tailscale/walk 最新主分支
        run: |
          # 强制拉取最新重构后的 master 版本
          go get github.com/tailscale/walk@master
          go mod tidy

      - name: 编译可执行程序
        run: |
          go build -v -o walk-poc.exe .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: walk-poc-tailscale-latest-windows-amd64
          path: walk-poc.exe
          if-no-files-found: error
