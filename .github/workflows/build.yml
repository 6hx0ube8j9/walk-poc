name: Build Walk POC (tailscale)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境并启用缓存
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: 使用仓库清单编译 rsrc.syso (AMD64 架构)
        run: |
          go install github.com/akavel/rsrc@latest
          $GOPATH = go env GOPATH
          & "$GOPATH\bin\rsrc.exe" -manifest app.manifest -arch amd64 -o rsrc.syso

      - name: 切换依赖至 tailscale/walk 并整理
        run: |
          go get github.com/tailscale/walk
          go mod tidy

      - name: 编译可执行程序
        run: |
          go build -v -o walk-poc.exe .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: walk-poc-tailscale-windows-amd64
          path: walk-poc.exe
          if-no-files-found: error
