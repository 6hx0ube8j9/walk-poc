name: Build Walk POC (tailscale replace hack)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 编译 rsrc.syso (AMD64 架构)
        run: |
          go install github.com/akavel/rsrc@latest
          $GOPATH = go env GOPATH
          & "$GOPATH\bin\rsrc.exe" -manifest app.manifest -arch amd64 -o rsrc.syso

      - name: 动态解析并劫持精准依赖
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue go.mod, go.sum
          go mod init walk-poc
          
          # 1. 将 walk 劫持到 Tailscale 最新版 (Tailscale 的 walk 仓库主分支仍叫 master)
          go mod edit -replace github.com/lxn/walk=github.com/tailscale/walk@master
          
          # 2. 动态读取 Tailscale 的 go.mod，提取他们真实使用的 win 库哈希版本！
          $tsMod = Invoke-RestMethod -Uri "https://raw.githubusercontent.com/tailscale/walk/master/go.mod"
          Write-Host "Tailscale 官方 go.mod 解析中..."
          
          # 匹配他们 go.mod 里的 replace github.com/lxn/win => xxxx v0.0.0-xxxx
          if ($tsMod -match 'github\.com/lxn/win\s*=>\s*([^\s]+)\s+([^\s\)]+)') {
              $winRepo = $matches[1]
              $winVer = $matches[2]
              Write-Host "成功捕获底层劫持: lxn/win => $winRepo @ $winVer"
              go mod edit -replace "github.com/lxn/win=${winRepo}@${winVer}"
          } else {
              Write-Host "警告: 未匹配到，回退使用 main 分支"
              go mod edit -replace github.com/lxn/win=github.com/tailscale/win@main
          }
          
          go get github.com/lxn/walk
          go mod tidy

      - name: 编译可执行程序
        run: |
          go build -v -o walk-poc.exe .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: walk-poc-tailscale-hacked-windows-amd64
          path: walk-poc.exe
          if-no-files-found: error
