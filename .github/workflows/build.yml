name: Build Walk POC (tailscale replace hack)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 编译 rsrc.syso (AMD64 架构)
        run: |
          go install github.com/akavel/rsrc@latest
          $GOPATH = go env GOPATH
          & "$GOPATH\bin\rsrc.exe" -manifest app.manifest -arch amd64 -o rsrc.syso

      - name: 重建模块与依赖劫持
        run: |
          # 删掉所有可能残留的旧版 mod 文件
          Remove-Item -Force -ErrorAction SilentlyContinue go.mod, go.sum
          
          # 重新初始化模块
          go mod init walk-poc
          
          # 双管齐下：把 walk 和 win 的底层全盘替换为 Tailscale 的最新 master
          go mod edit -replace github.com/lxn/walk=github.com/tailscale/walk@master
          go mod edit -replace github.com/lxn/win=github.com/tailscale/win@master
          
          # 拉取原版代码，但实际上会被自动导向 Tailscale 分支
          go get github.com/lxn/walk
          go mod tidy

      - name: 编译可执行程序
        run: |
          go build -v -o walk-poc.exe .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: walk-poc-tailscale-hacked-windows-amd64
          path: walk-poc.exe
          if-no-files-found: error
