name: Build Walk POC (lxn upstream)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境并启用缓存
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: 使用仓库根目录清单编译 rsrc.syso (指定 64 位架构)
        run: |
          go install github.com/akavel/rsrc@latest
          $GOPATH = go env GOPATH
          # 核心修复：显式指定 -arch amd64，避免默认回退到 386 架构
          & "$GOPATH\bin\rsrc.exe" -manifest app.manifest -arch amd64 -o rsrc.syso

      - name: 整理依赖
        run: |
          go mod tidy

      - name: 编译可执行程序
        run: |
          go build -v -o walk-poc.exe .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: walk-poc-lxn-windows-amd64
          path: walk-poc.exe
          if-no-files-found: error
