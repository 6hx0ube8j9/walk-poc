steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 编译 rsrc.syso
        run: |
          go install github.com/akavel/rsrc@latest
          $GOPATH = go env GOPATH
          & "$GOPATH\bin\rsrc.exe" -manifest app.manifest -arch amd64 -o rsrc.syso

      - name: 物理破解：本地拉取与源码劫持
        run: |
          # 1. 简单粗暴：直接把 Tailscale 的最新 walk 和 win 源码物理克隆到旁边
          git clone --depth=1 https://github.com/tailscale/walk.git tailscale-walk
          git clone --depth=1 https://github.com/tailscale/win.git tailscale-win
          
          # 2. 清除历史包袱
          Remove-Item -Force -ErrorAction SilentlyContinue go.mod, go.sum
          go mod init walk-poc
          
          # 3. 核心大招：路径劫持！告诉 Go 直接读本地文件夹，跳过所有网络依赖校验！
          go mod edit -replace github.com/lxn/walk=./tailscale-walk
          go mod edit -replace github.com/lxn/win=./tailscale-win
          
          # 4. 整理依赖并编译
          go get github.com/lxn/walk
          go mod tidy

      - name: 编译可执行程序
        run: |
          go build -v -o walk-poc.exe .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: walk-poc-tailscale-latest-local-hack
          path: walk-poc.exe
          if-no-files-found: error
